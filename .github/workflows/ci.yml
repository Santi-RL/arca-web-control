name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validación pública (Windows / Node 24)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Instalar dependencias reproducibles
        run: npm ci

      - name: Instalar Chromium de Playwright
        run: npx playwright install chromium

      - name: Verificar que el repositorio sea publicable
        run: npm run validate:public

      - name: Validar la skill
        run: npm run validate:skill

      - name: Verificar tipos
        run: npm run typecheck

      - name: Ejecutar pruebas
        run: npm test

      - name: Verificar capacidades y referencias generadas
        run: npm run arca:capability:check

      - name: Probar el MCP local
        run: npm run mcp:smoke

      - name: Auditar dependencias
        run: npm audit --audit-level=high
